services:
  db:
    image: mysql:5.7
    command: --character-set-server=utf8 --collation-server=utf8_general_ci --max_allowed_packet=128M
    environment:
      MYSQL_DATABASE: idealstroy_isipt
      MYSQL_USER: modx
      MYSQL_PASSWORD: modx_local_password
      MYSQL_ROOT_PASSWORD: modx_local_root_password
    volumes:
      - db-data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pmodx_local_root_password"]
      interval: 10s
      timeout: 5s
      retries: 30

  web:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:80"
    volumes:
      - ./:/var/www/html
      - ../.env:/run/secrets/isipto-bitrix24.env:ro

volumes:
  db-data:
