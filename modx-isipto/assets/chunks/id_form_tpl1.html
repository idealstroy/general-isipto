<form class="recaptcha-form form-new__form">
    
    <input type="hidden" name="recaptcha_token" class="recaptcha-token">
    
    
    <input class="callOrderReason" type="hidden" name="reason" value="Заявка - расчет стоимости">
    <input class="page" type="hidden" name="page" value="[[~[[*id]]? &scheme=`full`]]">
    <input class="goalMetrika" type="hidden" name="goal" value="button-gift">
    <input class="ref_info" name="ref_info" type="hidden" value="">

      <input class="site-message" type="text" name="name" value="">
  <input class="site-message" type="text" name="firstname" value="">
  <input class="site-message" type="text" name="lastname" value="">
  
  <input class="form-new__form-input" style="max-width:540px; width:100%;" type="text" placeholder="Имя" name="fio">
  <br>
  <input class="form-new__form-input" style="max-width:540px; width:100%;" type="tel" placeholder="Телефон" name="phone">

  <div class="r20"></div>
  <div class="r20"></div>
  
  <div class="form-footer__button-box d-flex flex-wrap flex-sm-nowrap align-items-center justify-content-between" style="max-width:540px; width:100%;" >

        <div class="form-footer__checkbox">
            <label><input type="checkbox" name="agree" required> 
            <span style="color: #ACACAC;font-size: 14px;line-height: 14px;">
            Я даю согласие на <a href="/politika-konfidenczialnosti/" style="color:#777;font-weight:500;">обработку своих персональных данных</a>

            </span></label>
        </div>



        <input class="btn btn_weight-normal form-footer__btn krasnaya_knopka" type="submit" value="Расчитать стоимость">
  </div>
    
    
</form>
