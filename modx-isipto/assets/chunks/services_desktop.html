<div class="services-item [[+price_old:is=``:then=`services-item_type-jobs`]] d-flex justify-content-between align-items-center">
    <div class="services-item-left">
        <a class="services-item__caption" href="https://isipto.ru[[+href]]">[[+title]]</a>
    </div>
    <div class="services-item-right d-flex justify-content-between align-items-center">
        <div class="services-item__price-box d-flex align-items-center flex-md-nowrap flex-wrap">
            <div class="services-item__price">
                [[+price]]
            </div>
            [[+price_old:ne=``:then=``]]
        </div>
        <a class="services-item-button btn-modal d-flex align-items-center" href="#form_up" rel="nofollow" data-reason="Заказать расчёт" data-header="Заказать расчёт" data-goal="main-2rd-2" onclick="ym(48630242, 'reachGoal', 'main-2rd-1'); fbq('track', 'InitiateCheckout'); return true;">
            <div class="services-item-button__text">Заказать расчёт</div>
        </a>
    </div>
</div>
