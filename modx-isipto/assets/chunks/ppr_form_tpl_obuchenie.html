<form class="recaptcha-form form-new__form">
    
    <input type="hidden" name="recaptcha_token" class="recaptcha-token">

<input type="hidden" name="csrf_token" value="[[+csrf_token]]">
<input type="hidden" name="form_time" value="[[+form_time]]">
    <input type="text" name="website" style="display:none">
    
    <input class="callOrderReason" type="hidden" name="reason" value="Заявка на обучение">
    <input class="page" type="hidden" name="page" value="[[~[[*id]]? &scheme=`full`]]">
    <input class="goalMetrika" type="hidden" name="goal" value="button-gift">
    <input class="ref_info" name="ref_info" type="hidden" value="">

      <input class="site-message" type="text" name="name" value="">
  <input class="site-message" type="text" name="firstname" value="">
  <input class="site-message" type="text" name="lastname" value="">
  <div class="inp_flex">
      
<select class="form-new__form-input form-pole ite_flex" name="razdel" style="background: #FFFFFF; max-width:100%;width:100%;">
    <option value="не выбран">Какой раздел хотите изучать?</option>
    <option value="АС, АР, КР - отделочные работы, кровля, фасады, благоустройство">АС, АР, КР - отделочные работы, кровля, фасады, благоустройство</option>
    <option value="КЖ - конструкции железобетонные, бетонные работы">КЖ - конструкции железобетонные, бетонные работы</option>
	<option value="КМ - конструкции металлические">КМ - конструкции металлические</option>
	<option value="ТХ - технологические трубопроводы (нефтепровод, газопровод)">ТХ - технологические трубопроводы (нефтепровод, газопровод)</option>
	<option value="ЭМР, ЭХЗ - Спец работы по электрике">ЭМР, ЭХЗ - Спец работы по электрике</option>
	<option value="ЭОМ, ЭО, ЭС - Обычные работы по электрике">ЭОМ, ЭО, ЭС - Обычные работы по электрике</option>
	<option value="А, АК, АТХ - Автоматика">А, АК, АТХ - Автоматика</option>
	<option value="СС, ОПС, ПС - Слаботочные системы">СС, ОПС, ПС - Слаботочные системы</option>
	<option value="ВК, НВК - Инженерные сети (водоснабжение, водоотведение, канализация)">ВК, НВК - Инженерные сети (водоснабжение, водоотведение, канализация)</option>
	<option value="ОВ - Инженерные сети (отопление, вентиляция, кондиционирование)">ОВ - Инженерные сети (отопление, вентиляция, кондиционирование)</option>
	<option value="АД - Автодороги">АД - Автодороги</option>
	<option value="Земляные работы">Земляные работы</option>
</select>
  
  
  </div>
  <div class="r10"></div>
    <div class="inp_flex">
  <input class="form-new__form-input form-pole ite_flex" type="text" placeholder="Имя" name="fio" style="background: #FFFFFF; max-width:100%;width:100%;">
  <input class="form-new__form-input form-pole ite_flex" type="tel" placeholder="Телефон" name="phone" style="background: #FFFFFF; max-width:100%;width:100%;">
     </div>
<div class="r20"></div>
        <div class="form-footer__checkbox" style="display: flex; align-items: center;gap:6px;line-height: 1.2;">
            <input type="checkbox" name="agree" required> 
            <label>
            <span style="color: #777;font-size: 14px;">
            Я даю согласие на <a href="/politika-konfidenczialnosti/" style="color:#777;font-weight:500;">обработку своих персональных данных</a>
            </span></label>
        </div>
        
     <input class="form-new__form-btn btn btn_light-red btn_h50 btn_weight-normal knopka-ppr krasnaya_knopka" style="max-width:100%" type="submit" value="Отправить заявку">
</form>
